spring.application.name=inventario
server.port=8080

# URL Externa de Render (fíjate en agregar 'jdbc:' al inicio y '?sslmode=require' al final)
spring.datasource.url=jdbc:postgresql://dpg-xxxxxx-a.oregon-postgres.render.com:5432/nombre_bd?sslmode=require
spring.datasource.username=usuario_de_render
spring.datasource.password=password_de_render
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true